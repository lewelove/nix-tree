[window]
padding = { x = 16, y = 16 }
dynamic_padding = true
# opacity = 1
opacity = 0.95
blur = true

[terminal.shell]
program = "/run/current-system/sw/bin/fish"

[font]
normal = { family = "CommitMono Nerd Font", style = "Regular" }
bold = { family = "CommitMono Nerd Font", style = "Bold" }
size = 10.0

# [font.offset]
# y = 4 # Adjusting to match your line-height preference

[cursor]
style = { shape = "Beam", blinking = "Never" }

[colors.primary]
background = "#111111"
foreground = "#cccccc"

[colors.cursor]
cursor = "#cccccc"
text = "#000000"

[colors.normal]
black   = "#323232"
red     = "#ea4335"
green   = "#34a853"
yellow  = "#fbbc04"
blue    = "#4285f4"
magenta = "#a142f4"
cyan    = "#4285f4"
white   = "#cccccc"

[colors.bright]
black   = "#5a5a5a"
red     = "#ea4335"
green   = "#34a853"
yellow  = "#fbbc04"
blue    = "#4285f4"
magenta = "#a142f4"
cyan    = "#4285f4"
white   = "#cccccc"
