[files]

dale = {
  run = "repomix ~/dev/dale --quiet && repomix ~/.config/dale --quiet",
  paste = [
  "~/Folders/XML Packed/~-dev-dale.xml",
  "~/Folders/XML Packed/~-.config-dale.xml"
  ]
}

nix-config = {
  run = "repomix ~/nix-config --quiet",
  paste = [ "~/Folders/XML Packed/~-nix-config.xml" ]
}

"starve!" = {
  run = "repomix ~/dev/dst_mods/starve! --quiet",
  paste = [ "~/Folders/XML Packed/~-dev-dst_mods-starve!.xml" ]
}

album_curation = {
  run = "repomix ~/dev/album_curation --quiet",
  paste = [
  "~//Folders/XML Packed/~-dev-album_curation.xml",
  ]
}

